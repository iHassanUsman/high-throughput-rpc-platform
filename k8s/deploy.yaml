apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rpc-gateway
  template:
    metadata:
      labels:
        app: rpc-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/ihassanusman/rpc-gateway:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -Dspring.threads.virtual.enabled=true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rpc-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rpc-gateway
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rpc-worker
  template:
    metadata:
      labels:
        app: rpc-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/ihassanusman/rpc-worker:1.0.0
          ports:
            - containerPort: 8081
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: WORKER_CONCURRENT
              value: "8"
            - name: WORKER_MAX_CONCURRENT
              value: "32"
            - name: WORKER_PREFETCH
              value: "10"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rpc-worker-keda
spec:
  scaleTargetRef:
    name: rpc-worker
  minReplicaCount: 3
  maxReplicaCount: 40
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: pulse.enrichment.rpc
        mode: QueueLength
        value: "50"
